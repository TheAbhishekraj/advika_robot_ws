<?xml version="1.0" encoding="UTF-8"?>
<!-- ADVIKA 3.0 — Complete Wiring Diagram SVG -->
<!-- Open in browser or Inkscape/Fusion 360 for full view -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-yellow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#0a0e17"/>
  <text x="20" y="40" fill="#e5e7eb" font-size="22" font-weight="bold">ADVIKA 3.0 — Complete Wiring Diagram</text>
  <text x="20" y="62" fill="#6b7280" font-size="13">Advika AMR — Electrical Schematic | v1.0 | 2026-07-26</text>

  <!-- Legend -->
  <rect x="900" y="15" width="280" height="130" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="910" y="35" fill="#e5e7eb" font-size="12" font-weight="bold">LEGEND</text>
  <line x1="910" y1="45" x2="950" y2="45" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="960" y="49" fill="#e5e7eb" font-size="11">Power (VBAT 11.1V)</text>
  <line x1="910" y1="60" x2="950" y2="60" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="960" y="64" fill="#e5e7eb" font-size="11">Signal / Data</text>
  <line x1="910" y1="75" x2="950" y2="75" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-yellow)"/>
  <text x="960" y="79" fill="#e5e7eb" font-size="11">5V Rail</text>
  <line x1="910" y1="90" x2="950" y2="90" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="960" y="94" fill="#e5e7eb" font-size="11">3.3V Rail</text>
  <text x="910" y="112" fill="#6b7280" font-size="11">⚡ Safety relay (E-Stop)</text>
  <text x="910" y="128" fill="#6b7280" font-size="11">⚠️  NC = Normally Closed</text>

  <!-- ═══ BATTERY ═══ -->
  <rect x="30" y="160" width="120" height="80" rx="8" fill="#1a1a2e" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="50" y="185" fill="#ef4444" font-size="13" font-weight="bold">3S2P 18650</text>
  <text x="50" y="202" fill="#e5e7eb" font-size="11">11.1V / 5200mAh</text>
  <text x="50" y="218" fill="#6b7280" font-size="11">XT60 Connector</text>
  <!-- Battery + terminal -->
  <circle cx="45" cy="240" r="6" fill="#ef4444"/>
  <text x="40" y="255" fill="#ef4444" font-size="10" text-anchor="middle">VBAT+</text>
  <!-- Battery - terminal -->
  <circle cx="75" cy="240" r="6" fill="#6b7280"/>
  <text x="70" y="255" fill="#6b7280" font-size="10" text-anchor="middle">GND</text>

  <!-- ═══ BMS ═══ -->
  <rect x="180" y="150" width="100" height="100" rx="8" fill="#1a1a2e" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="172" fill="#f59e0b" font-size="12" font-weight="bold">BMS</text>
  <text x="188" y="190" fill="#6b7280" font-size="10">I2C: 0x0B</text>
  <text x="188" y="204" fill="#6b7280" font-size="10">OVP/OCP/SCP</text>
  <text x="188" y="218" fill="#6b7280" font-size="10">Cell Balance</text>
  <text x="188" y="235" fill="#f59e0b" font-size="10">→ 5V Buck</text>
  <text x="188" y="248" fill="#f59e0b" font-size="10">→ DRV8833</text>

  <!-- Power from battery to BMS -->
  <line x1="75" y1="240" x2="180" y2="195" stroke="#ef4444" stroke-width="2.5"/>
  <text x="110" y="215" fill="#ef4444" font-size="9">VBAT+</text>
  <line x1="75" y1="240" x2="180" y2="220" stroke="#6b7280" stroke-width="2"/>
  <text x="110" y="232" fill="#6b7280" font-size="9">GND</text>

  <!-- ═══ 5V BUCK CONVERTER ═══ -->
  <rect x="180" y="280" width="100" height="60" rx="8" fill="#1a1a2e" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="300" fill="#f59e0b" font-size="12" font-weight="bold">5V Buck</text>
  <text x="188" y="316" fill="#6b7280" font-size="10">LM2596 / MP1584</text>
  <text x="188" y="330" fill="#e5e7eb" font-size="10">3A max</text>

  <!-- BMS to Buck -->
  <line x1="210" y1="250" x2="210" y2="280" stroke="#ef4444" stroke-width="2"/>
  <text x="215" y="268" fill="#ef4444" font-size="9">VBAT</text>

  <!-- ═══ DRV8833 MOTOR DRIVER ═══ -->
  <rect x="30" y="380" width="140" height="100" rx="8" fill="#1a1a2e" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="50" y="402" fill="#ef4444" font-size="12" font-weight="bold">DRV8833</text>
  <text x="38" y="418" fill="#6b7280" font-size="10">Dual H-Bridge</text>
  <text x="38" y="432" fill="#6b7280" font-size="10">2× 1.5A per channel</text>
  <text x="38" y="446" fill="#e5e7eb" font-size="10">AIN/BIN ← ESP32 PWM</text>
  <text x="38" y="460" fill="#e5e7eb" font-size="10">OUTA/B → Motors</text>
  <text x="38" y="474" fill="#e5e7eb" font-size="10">VMOT ← Battery+</text>

  <!-- BMS to DRV8833 -->
  <line x1="210" y1="320" x2="100" y2="380" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="150" y="348" fill="#ef4444" font-size="9">VBAT direct</text>

  <!-- ═══ LEFT MOTOR ═══ -->
  <rect x="30" y="520" width="100" height="60" rx="8" fill="#1a1a2e" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="42" y="542" fill="#10b981" font-size="12" font-weight="bold">JGA25-370</text>
  <text x="42" y="558" fill="#e5e7eb" font-size="10">Left Motor</text>
  <text x="42" y="572" fill="#6b7280" font-size="10">170 RPM / 6mm D-shaft</text>

  <!-- DRV8833 to Left Motor -->
  <line x1="80" y1="480" x2="80" y2="520" stroke="#ef4444" stroke-width="2"/>
  <text x="85" y="502" fill="#ef4444" font-size="9">PWM+L/R</text>

  <!-- ═══ RIGHT MOTOR ═══ -->
  <rect x="160" y="520" width="100" height="60" rx="8" fill="#1a1a2e" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="172" y="542" fill="#10b981" font-size="12" font-weight="bold">JGA25-370</text>
  <text x="172" y="558" fill="#e5e7eb" font-size="10">Right Motor</text>
  <text x="172" y="572" fill="#6b7280" font-size="10">170 RPM / 6mm D-shaft</text>

  <!-- DRV8833 to Right Motor -->
  <line x1="140" y1="480" x2="210" y2="520" stroke="#ef4444" stroke-width="2"/>

  <!-- ═══ ESP32-S3 ═══ -->
  <rect x="340" y="150" width="130" height="220" rx="8" fill="#1a1a2e" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="172" fill="#3b82f6" font-size="13" font-weight="bold">ESP32-S3 DevKitC-1</text>
  <text x="350" y="188" fill="#6b7280" font-size="10">Main Controller</text>
  <line x1="348" y1="193" x2="462" y2="193" stroke="#1f2937" stroke-width="1"/>

  <!-- ESP32 pins -->
  <text x="350" y="208" fill="#e5e7eb" font-size="9">GPIO4  → LEFT_PWM</text>
  <text x="350" y="223" fill="#e5e7eb" font-size="9">GPIO5  → LEFT_DIR1</text>
  <text x="350" y="238" fill="#e5e7eb" font-size="9">GPIO6  → LEFT_DIR2</text>
  <text x="350" y="253" fill="#e5e7eb" font-size="9">GPIO7  ← LEFT_ENC_A</text>
  <text x="350" y="268" fill="#e5e7eb" font-size="9">GPIO8  ← LEFT_ENC_B</text>
  <text x="350" y="283" fill="#e5e7eb" font-size="9">GPIO9  → RIGHT_PWM</text>
  <text x="350" y="298" fill="#e5e7eb" font-size="9">GPIO10 → RIGHT_DIR1</text>
  <text x="gray" y="313" fill="#e5e7eb" font-size="9">GPIO11 → RIGHT_DIR2</text>
  <text x="350" y="328" fill="#e5e7eb" font-size="9">GPIO12 ← RIGHT_ENC_A</text>
  <text x="350" y="343" fill="#e5e7eb" font-size="9">GPIO13 ← RIGHT_ENC_B</text>
  <text x="350" y="358" fill="#ef4444" font-size="9">GPIO14 → E-STOP (in)</text>
  <text x="350" y="373" fill="#e5e7eb" font-size="9">GPIO1  → I2C SDA</text>
  <text x="350" y="388" fill="#e5e7eb" font-size="9">GPIO2  → I2C SCL</text>

  <!-- ESP32 to DRV8833 PWM lines -->
  <line x1="370" y1="210" x2="370" y2="430" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="370" y1="430" x2="170" y2="430" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="260" y="425" fill="#3b82f6" font-size="9">PWM + DIR</text>

  <!-- ═══ 5V Rail from Buck ═══ -->
  <line x1="280" y1="310" x2="340" y2="310" stroke="#f59e0b" stroke-width="2"/>
  <text x="295" y="305" fill="#f59e0b" font-size="9">5V rail</text>

  <!-- ESP32 to LiDAR -->
  <line x1="470" y1="200" x2="560" y2="200" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="485" y="195" fill="#6b7280" font-size="9">UART TX/RX</text>

  <!-- ═══ LiDAR ═══ -->
  <rect x="560" y="165" width="130" height="70" rx="8" fill="#1a1a2e" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="578" y="187" fill="#3b82f6" font-size="12" font-weight="bold">YDLIDAR X4</text>
  <text x="570" y="203" fill="#6b7280" font-size="10">360° LiDAR</text>
  <text x="570" y="217" fill="#e5e7eb" font-size="10">UART @ 230400</text>
  <text x="570" y="231" fill="#f59e0b" font-size="10">VCC ← 5V rail</text>

  <!-- ═══ I2C Bus (shared) ═══ -->
  <line x1="470" y1="360" x2="1000" y2="360" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="700" y="355" fill="#3b82f6" font-size="10">I2C Bus (SDA/SCL) — 0x29 ToF | 0x28 IMU | 0x3C OLED</text>

  <!-- ═══ VL53L5CX ToF ═══ -->
  <rect x="340" y="420" width="100" height="65" rx="8" fill="#1a1a2e" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="440" fill="#10b981" font-size="11" font-weight="bold">VL53L5CX</text>
  <text x="350" y="455" fill="#e5e7eb" font-size="10">8×8 ToF Array</text>
  <text x="350" y="470" fill="#6b7280" font-size="9">I2C: 0x29</text>
  <text x="350" y="482" fill="#10b981" font-size="9">3.3V LDO</text>
  <line x1="400" y1="420" x2="400" y2="360" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="405" y="395" fill="#10b981" font-size="9">3.3V / I2C</text>

  <!-- ═══ BNO055 IMU ═══ -->
  <rect x="460" y="420" width="100" height="65" rx="8" fill="#1a1a2e" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="440" fill="#10b981" font-size="11" font-weight="bold">BNO055</text>
  <text x="470" y="455" fill="#e5e7eb" font-size="10">9-DOF IMU</text>
  <text x="470" y="470" fill="#6b7280" font-size="9">I2C: 0x28</text>
  <text x="470" y="482" fill="#10b981" font-size="9">3.3V LDO</text>
  <line x1="520" y1="420" x2="520" y2="360" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- ═══ SSD1306 OLED ═══ -->
  <rect x="580" y="420" width="100" height="65" rx="8" fill="#1a1a2e" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="592" y="440" fill="#10b981" font-size="11" font-weight="bold">SSD1306 OLED</text>
  <text x="592" y="455" fill="#e5e7eb" font-size="10">128×64 Display</text>
  <text x="592" y="470" fill="#6b7280" font-size="9">I2C: 0x3C</text>
  <text x="592" y="482" fill="#10b981" font-size="9">3.3V LDO</text>
  <line x1="630" y1="420" x2="630" y2="360" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- ═══ Raspberry Pi 5 ═══ -->
  <rect x="720" y="150" width="140" height="200" rx="8" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="738" y="172" fill="#8b5cf6" font-size="13" font-weight="bold">Raspberry Pi 5</text>
  <text x="728" y="188" fill="#6b7280" font-size="10">8GB — Main Compute</text>
  <line x1="726" y1="193" x2="854" y2="193" stroke="#1f2937" stroke-width="1"/>
  <text x="728" y="208" fill="#e5e7eb" font-size="9">USB-A ← Cameras ×2</text>
  <text x="728" y="223" fill="#e5e7eb" font-size="9">USB-C ← ESP32 UART</text>
  <text x="728" y="238" fill="#e5e7eb" font-size="9">WiFi / Ethernet</text>
  <text x="728" y="258" fill="#6b7280" font-size="9">─ ROS2 Jazzy ─</text>
  <text x="728" y="273" fill="#e5e7eb" font-size="9">/advika/cmd_vel</text>
  <text x="728" y="288" fill="#e5e7eb" font-size="9">/advika/odom</text>
  <text x="728" y="303" fill="#e5e7eb" font-size="9">/advika/scan</text>
  <text x="728" y="318" fill="#e5e7eb" font-size="9">/advika/imu/data</text>
  <text x="728" y="333" fill="#e5e7eb" font-size="9">/advika/horizon/floor</text>

  <!-- Pi5 to cameras -->
  <line x1="860" y1="210" x2="1000" y2="210" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="910" y="205" fill="#8b5cf6" font-size="9">USB</text>

  <!-- ═══ Camera Modules ═══ -->
  <rect x="1000" y="160" width="120" height="100" rx="8" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1015" y="182" fill="#8b5cf6" font-size="12" font-weight="bold">Pi Camera 3 Wide</text>
  <text x="1012" y="200" fill="#e5e7eb" font-size="10">Horizon Camera</text>
  <text x="1012" y="214" fill="#6b7280" font-size="9">/dev/video0</text>
  <text x="1012" y="228" fill="#6b7280" font-size="9">15° upward tilt</text>
  <text x="1012" y="246" fill="#e5e7eb" font-size="10">Floor Camera</text>
  <text x="1012" y="260" fill="#6b7280" font-size="9">/dev/video1</text>
  <text x="1012" y="274" fill="#6b7280" font-size="9">45° downward tilt</text>

  <!-- ═══ E-STOP Safety Circuit ═══ -->
  <rect x="30" y="620" width="230" height="110" rx="8" fill="#1a1a2e" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="48" y="642" fill="#ef4444" font-size="13" font-weight="bold">SAFETY: E-STOP CIRCUIT</text>
  <text x="38" y="660" fill="#e5e7eb" font-size="10">Battery(+) ──┤NC E-STOP├───┬── DRV8833 VMOT</text>
  <text x="38" y="676" fill="#e5e7eb" font-size="10">              │ Latching │  │</text>
  <text x="38" y="692" fill="#e5e7eb" font-size="10">              └──────────┘  │</text>
  <text x="38" y="708" fill="#ef4444" font-size="10">When E-Stop pressed → NC opens → Motors cut</text>
  <text x="38" y="724" fill="#e5e7eb" font-size="10">ESP32 GPIO14 (pull-up) detects LOW → ISR</text>

  <!-- ═══ 3.3V LDO ═══ -->
  <rect x="710" y="380" width="100" height="50" rx="8" fill="#1a1a2e" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="720" y="400" fill="#10b981" font-size="11" font-weight="bold">3.3V LDO</text>
  <text x="720" y="416" fill="#6b7280" font-size="10">→ ToF / IMU / OLED</text>

  <!-- 5V to 3.3V LDO -->
  <line x1="280" y1="320" x2="760" y2="400" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="510" y="358" fill="#f59e0b" font-size="9">5V → 3.3V LDO</text>

  <!-- ═══ Power Rail Labels ═══ -->
  <rect x="900" y="160" width="200" height="90" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="910" y="180" fill="#e5e7eb" font-size="11" font-weight="bold">VOLTAGE RAILS</text>
  <text x="910" y="197" fill="#ef4444" font-size="10">VBAT:  11.1V — Battery</text>
  <text x="910" y="212" fill="#f59e0b" font-size="10">V5V:    5.0V — Buck from BMS</text>
  <text x="910" y="227" fill="#10b981" font-size="10">V3V3:  3.3V — LDO from 5V</text>
  <text x="910" y="242" fill="#6b7280" font-size="9">Current draw ~1.5A normal</text>

  <!-- ═══ Color code boxes ═══ -->
  <rect x="900" y="270" width="200" height="115" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="910" y="290" fill="#e5e7eb" font-size="11" font-weight="bold">CONNECTOR COLORS</text>
  <rect x="910" y="298" width="16" height="10" fill="#ef4444" rx="2"/>
  <text x="932" y="308" fill="#e5e7eb" font-size="10">Power / +V</text>
  <rect x="910" y="314" width="16" height="10" fill="#6b7280" rx="2"/>
  <text x="932" y="324" fill="#e5e7eb" font-size="10">Ground (GND)</text>
  <rect x="910" y="330" width="16" height="10" fill="#3b82f6" rx="2"/>
  <text x="932" y="340" fill="#e5e7eb" font-size="10">Signal / Data</text>
  <rect x="910" y="346" width="16" height="10" fill="#10b981" rx="2"/>
  <text x="932" y="356" fill="#e5e7eb" font-size="10">3.3V devices</text>
  <rect x="910" y="362" width="16" height="10" fill="#8b5cf6" rx="2"/>
  <text x="932" y="372" fill="#e5e7eb" font-size="10">Pi 5 / high-level</text>

  <!-- ═══ Pin Reference Table ═══ -->
  <rect x="900" y="400" width="280" height="290" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="910" y="420" fill="#e5e7eb" font-size="11" font-weight="bold">ESP32-S3 PIN REFERENCE</text>
  <text x="910" y="438" fill="#e5e7eb" font-size="9">GPIO  | Function       | Connected To</text>
  <line x1="908" y1="443" x2="1175" y2="443" stroke="#1f2937" stroke-width="0.5"/>
  <text x="910" y="455" fill="#e5e7eb" font-size="9">GPIO1 | I2C SDA        | ToF, IMU, OLED (shared bus)</text>
  <text x="910" y="468" fill="#e5e7eb" font-size="9">GPIO2 | I2C SCL        | ToF, IMU, OLED (shared bus)</text>
  <text x="910" y="481" fill="#e5e7eb" font-size="9">GPIO4 | LEFT_PWM       | DRV8833 AIN1 (Left motor speed)</text>
  <text x="910" y="494" fill="#e5e7eb" font-size="9">GPIO5 | LEFT_DIR1      | DRV8833 AIN2</text>
  <text x="910" y="507" fill="#e5e7eb" font-size="9">GPIO6 | LEFT_DIR2      | DRV8833 AIN3</text>
  <text x="910" y="520" fill="#e5e7eb" font-size="9">GPIO7 | LEFT_ENC_A     | Left motor encoder A</text>
  <text x="910" y="533" fill="#e5e7eb" font-size="9">GPIO8 | LEFT_ENC_B     | Left motor encoder B</text>
  <text x="910" y="546" fill="#e5e7eb" font-size="9">GPIO9 | RIGHT_PWM      | DRV8833 BIN1 (Right motor speed)</text>
  <text x="910" y="559" fill="#e5e7eb" font-size="9">GPIO10| RIGHT_DIR1     | DRV8833 BIN2</text>
  <text x="910" y="572" fill="#e5e7eb" font-size="9">GPIO11| RIGHT_DIR2     | DRV8833 BIN3</text>
  <text x="910" y="585" fill="#e5e7eb" font-size="9">GPIO12| RIGHT_ENC_A    | Right motor encoder A</text>
  <text x="910" y="598" fill="#e5e7eb" font-size="9">GPIO13| RIGHT_ENC_B    | Right motor encoder B</text>
  <text x="910" y="611" fill="#ef4444" font-size="9">GPIO14| E-STOP_IN      | E-Stop button (NC, pull-up HIGH)</text>
